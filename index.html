<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top w-100">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html">Musify</a>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <button class="user-button nav-link active" aria-current="page">User Info</button>
                    </li>
                    <li class="nav-item">
                        <button class="artists-button nav-link active">Get Top 5 Artists</button>
                    </li>
                    <li class="nav-item">
                        <button class="tracks-button nav-link active">Get Top 5 Albums</button>
                    </li>
                </ul>
                <form id="searchForm" class="d-flex" role="search">
                    <input id="searchInput" class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>                              
            </div>
        </div>
    </nav>

    <ul id="artistList" class="list-unstyled mt-3"></ul>

    <div id="userInfo" class="user-info-toggle cardo-regular">
        <h1>THIS IS MUSIFY</h1>
    </div>

    <button class = "logout-button">Logout</button>

    <script type="module" src="./index.js"></script>
</body>
</html>
